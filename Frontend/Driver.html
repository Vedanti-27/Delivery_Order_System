<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Spice Hub Express — Driver</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#651C22; --maroon-dark:#4A1319; --saffron:#E7A93C; --saffron-dark:#C98A22;
  --cream:#FBF6EC; --card:#FFFFFF; --ink:#2B211C; --ink-soft:#6b5f57; --line:#E9DFCF; --teal:#1F6F6F;
  --st-green:#1E8E5A; --st-red:#D64545; --st-yellow:#C9911A; --st-blue:#2563EB; --st-orange:#EA7317; --st-purple:#7C4DFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{max-width:480px;margin:0 auto;overscroll-behavior-y:contain;}
body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;padding-bottom:28px;font-size:.94rem;}
h1,h2,h3,h4,.display-font{font-family:'Fraunces',serif;color:var(--maroon-dark);}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---- Top bar (compact, sticky, safe-area aware) ---- */
.topbar{
  background:linear-gradient(120deg,var(--maroon) 0%,var(--maroon-dark) 100%);
  color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:1000;box-shadow:0 4px 18px rgba(0,0,0,.18);
}
.topbar .brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;}
.topbar .brand small{display:block;font-family:'Inter',sans-serif;font-weight:600;font-size:.65rem;color:#F3D9A6;letter-spacing:.06em;text-transform:uppercase;}
.brand .fa-pepper-hot{color:var(--saffron);}
.topbar .btn{padding:.32rem .55rem;font-size:.8rem;}

/* ---- Layout: single column, tight padding ---- */
.page{padding:14px 12px 8px;}
.section-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(101,28,34,.05);
}
.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;font-weight:700;color:var(--teal);margin-bottom:3px;}
h4{font-size:1.15rem;} h5{font-size:1rem;}

.badge-status{border-radius:20px;padding:4px 10px;font-weight:700;font-size:.68rem;letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px;}
.badge-status.ASSIGNED{background:#DCE7FF;color:var(--st-blue);}
.badge-status.OUT_FOR_DELIVERY{background:#FDE6D2;color:var(--st-orange);}
.badge-status.DELIVERED{background:#DCF3E6;color:var(--st-green);}
.badge-status.AVAILABLE{background:#DCF3E6;color:var(--st-green);}
.badge-status.BUSY{background:#FBE0E0;color:var(--st-red);}

.map-box{height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}

.order-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;border-top:4px solid var(--saffron);}
.order-card .oid{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--maroon-dark);font-size:.92rem;}

/* ---- Big, thumb-friendly action buttons ---- */
.btn-brand{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:600;}
.btn-brand:hover{background:var(--maroon-dark);border-color:var(--maroon-dark);color:#fff;}
.btn-saffron{background:var(--saffron);border-color:var(--saffron-dark);color:var(--maroon-dark);font-weight:700;}
.btn-saffron:hover{background:var(--saffron-dark);color:#fff;}
.action-row{display:flex;gap:8px;}
.action-row .btn{flex:1;padding:.62rem .5rem;font-size:.86rem;border-radius:10px;}

.small-note{font-size:.74rem;color:var(--ink-soft);}
#toastHost{position:fixed;top:calc(64px + env(safe-area-inset-top));left:8px;right:8px;z-index:2000;width:auto;}
#toastHost .toast{width:100%;font-size:.86rem;}

/* ---- Auth screen ---- */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--maroon) 0%,var(--maroon-dark) 55%,#2c0d10 100%);
  padding:20px 16px;
}
.auth-card{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.25rem;color:var(--maroon-dark);display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.auth-brand .fa-pepper-hot{color:var(--saffron-dark);}
.auth-sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:18px;}
.auth-card .form-control,.auth-card .btn{padding:.6rem .75rem;font-size:.92rem;}
.auth-error{color:var(--st-red);font-size:.8rem;min-height:16px;margin-top:6px;}
.auth-hint{font-size:.76rem;color:var(--ink-soft);margin-top:8px;}
.auth-hint a{color:var(--teal);cursor:pointer;}
.creds-box{margin-top:12px;background:var(--cream);border:1px dashed var(--saffron-dark);border-radius:10px;padding:10px 12px;font-size:.8rem;color:var(--maroon-dark);}

/* ---- Dark theme ---- */
body.dark-theme{background:#181210;color:#EFE7DD;}
body.dark-theme .section-card,body.dark-theme .order-card{background:#241C18;border-color:#3A2E27;color:#EFE7DD;}
body.dark-theme h1,body.dark-theme h2,body.dark-theme h3,body.dark-theme h4{color:#F3D9A6;}
body.dark-theme .eyebrow{color:#57C7C7;}
body.dark-theme .small-note{color:#B9AC9F;}

/* Leaflet control sizing on small screens */
.leaflet-touch .leaflet-bar a{width:32px;height:32px;line-height:32px;}
</style>
</head>
<body>

<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-pepper-hot"></i> Spice Hub Express</div>
    <p class="auth-sub">Driver sign in</p>
    <label class="form-label fw-semibold">Driver ID</label>
    <input type="text" id="loginDrvId" class="form-control mb-2" placeholder="e.g. D01">
    <label class="form-label fw-semibold">Password</label>
    <input type="password" id="loginDrvPass" class="form-control mb-2" placeholder="••••••••">
    <button class="btn btn-brand w-100" id="btnDrvLogin"><i class="fa-solid fa-right-to-bracket me-1"></i>Sign in</button>
    <div class="auth-error" id="drvLoginErr"></div>
    <div class="auth-hint"><a id="showDrvCreds">Show demo driver credentials</a></div>
    <div id="credsBox" class="creds-box d-none"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">
<div class="topbar d-flex align-items-center justify-content-between">
  <div class="brand"><i class="fa-solid fa-pepper-hot"></i> <div>Spice Hub<small>Driver</small></div></div>
  <div class="d-flex align-items-center gap-2">
    <button id="darkToggleBtn" class="btn btn-outline-light" title="Toggle day/night theme"><i class="fa-solid fa-moon"></i></button>
    <button id="logoutBtn" class="btn btn-outline-light"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</div>
<div id="toastHost"></div>

<div class="page">
  <div class="section-card" id="driverInfoCard"></div>

  <div class="section-card">
    <div class="eyebrow">Route</div>
    <h5 class="mb-2">Pickup &amp; delivery locations</h5>
    <div id="driverMap" class="map-box"></div>
  </div>

  <div class="section-card">
    <div class="eyebrow">Assigned group</div>
    <h5 class="mb-2">Orders on this run</h5>
    <div id="driverOrdersBox"></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===================== Shared constants ===================== */
const STORE_KEY = "spicehub_store";
const PUNE_AREAS = {
  "Hinjewadi":{lat:18.5250,lng:73.8570,roads:["Phase 1 Road","Phase 2 Road","Wakad Link Road"]},
  "Baner":{lat:18.5298,lng:73.8689,roads:["Baner Road","Sus Road","High Street Rd"]},
  "Pimpri":{lat:18.5252,lng:73.8528,roads:["Old Mumbai Road","PCMC Chowk Rd"]},
  "Hadapsar":{lat:18.5248,lng:73.8624,roads:["Solapur Road","Magarpatta Road"]},
  "Kothrud":{lat:18.5134,lng:73.8541,roads:["Karve Road","Paud Road","DP Road"]},
  "Shivajinagar":{lat:18.5225,lng:73.8614,roads:["FC Road","JM Road","Ghole Road"]},
  "Viman Nagar":{lat:18.5260,lng:73.8594,roads:["Viman Nagar Road","Airport Road"]},
  "Wagholi":{lat:18.5480,lng:73.8517,roads:["Nagar Road","Kesnand Road"]},
  "Kharadi":{lat:18.5246,lng:73.8513,roads:["Kharadi Bypass","EON Road"]},
  "Aundh":{lat:18.5176,lng:73.8531,roads:["Aundh Road","ITI Road"]}
};
const FOOD_ITEMS=[
 {id:"pizza",name:"Pizza (Margherita)",price:293},{id:"burger",name:"Burger (Classic)",price:288},
 {id:"fchicken",name:"Fried Chicken",price:268},{id:"koshary",name:"Koshary Special",price:261},
 {id:"pasta",name:"Pasta (Penne)",price:229},{id:"salad",name:"Salad (Fresh Garden)",price:274},
 {id:"sandwich",name:"Club Sandwich",price:235},{id:"shawarma",name:"Shawarma Special",price:270},
 {id:"sushi",name:"Sushi Roll",price:273},{id:"paneer",name:"Paneer Tikka",price:219},
 {id:"vbir",name:"Veg Biryani",price:189},{id:"cbir",name:"Chicken Biryani",price:239},
 {id:"idli",name:"Idli Sambhar",price:149},{id:"dosa",name:"Masala Dosa",price:179},
 {id:"vpulao",name:"Veg Pulao",price:199},{id:"dal",name:"Dal Tadka",price:179},
 {id:"chole",name:"Chole Bhature",price:209},{id:"momos",name:"Veg Momos",price:159},
 {id:"cmomos",name:"Chicken Momos",price:189},{id:"tikka",name:"Chicken Tikka",price:289},
 {id:"kebab",name:"Seekh Kebab",price:299},{id:"fish",name:"Fish Curry",price:309},
 {id:"prawns",name:"Prawn Masala",price:329},{id:"noodles",name:"Veg Hakka Noodles",price:189},
 {id:"manchurian",name:"Veg Manchurian",price:199},{id:"friedrice",name:"Chicken Fried Rice",price:219},
 {id:"softdrink",name:"Soft Drink",price:60},{id:"lassi",name:"Sweet Lassi",price:89},
 {id:"gulab",name:"Gulab Jamun (2 pc)",price:79},{id:"icecream",name:"Ice Cream Sundae",price:129},
 {id:"thali",name:"Spice Hub Thali",price:349}
];
const FIRST_NAMES=["Aarav","Vivaan","Aditya","Ishaan","Reyansh","Krishna","Arjun","Sai","Rohan","Kabir","Aanya","Diya","Myra","Anika","Ira","Saanvi","Aadhya","Kiara","Riya","Prisha","Rahul","Sanjay","Vikram","Aditi","Neha","Pooja","Meera","Kavya","Rutuja","Sneha"];
const LAST_NAMES=["Sharma","Patil","Deshmukh","Kulkarni","Joshi","Kale","Bhosale","Pawar","Gaikwad","Shinde"];
const DRIVER_NAMES=["Rajesh Pawar","Suresh Jadhav","Mahesh Kale","Ganesh Shinde","Vikas Bhosale","Ramesh Gaikwad","Ajay Kulkarni","Sandeep Deshmukh","Prakash Salunkhe","Dinesh Chavan"];
const RESTAURANT={name:"Spice Hub Central Kitchen",area:"Shivajinagar",lat:18.5204,lng:73.8567};
const CUSTOMER_COUNT=250;

function roadCoord(area,road){
  const base=PUNE_AREAS[area]||PUNE_AREAS["Shivajinagar"];
  const idx=base.roads.indexOf(road);
  const lat=base.lat+(idx*0.0016)-0.0009+(Math.random()-0.5)*0.0009;
  const lng=base.lng+(idx*0.0016)-0.0009+(Math.random()-0.5)*0.0009;
  return {lat:+lat.toFixed(4),lng:+lng.toFixed(4)};
}
function pad(n,w){return String(n).padStart(w,"0");}
function generateCustomers(){
  const areaKeys=Object.keys(PUNE_AREAS); const list=[];
  for(let i=1;i<=CUSTOMER_COUNT;i++){
    const area=areaKeys[Math.floor(Math.random()*areaKeys.length)];
    const roads=PUNE_AREAS[area].roads;
    const road=roads[Math.floor(Math.random()*roads.length)];
    const coord=roadCoord(area,road);
    const fn=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];
    const ln=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
    const idNum=Math.floor(1000+Math.random()*8999);
    const email=(fn+"."+ln+idNum).toLowerCase()+"@example.com";
    list.push({id:"U"+idNum,name:fn+" "+ln,email,area,road,lat:coord.lat,lng:coord.lng,phone:"98"+Math.floor(10000000+Math.random()*89999999)});
  }
  return list;
}
function generateDrivers(){
  return DRIVER_NAMES.map((n,i)=>({id:"D"+pad(i+1,2),name:n,status:"AVAILABLE",groupKey:null,orderIds:[],
    lat:RESTAURANT.lat+(Math.random()-0.5)*0.01, lng:RESTAURANT.lng+(Math.random()-0.5)*0.01}));
}
function freshStore(){
  return {restaurantStatus:"OPEN",customers:generateCustomers(),drivers:generateDrivers(),orders:[],waitingQueue:[],orderCounter:1};
}
function driverPassword(d){ return d.id.toLowerCase()+"@123"; }

/* ===================== Persistent shared storage ===================== */
async function loadStore(){
  try{
    const res=await window.storage.get(STORE_KEY,true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  const init=freshStore();
  try{ await window.storage.set(STORE_KEY, JSON.stringify(init), true); }catch(e){ console.error(e); }
  return init;
}
async function saveStore(store){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(store), true); }catch(e){ console.error("Storage error", e); }
}
async function refreshStore(){
  try{
    const res=await window.storage.get(STORE_KEY,true);
    if(res && res.value) STORE=JSON.parse(res.value);
  }catch(e){}
}

let STORE=null;
let currentDriverId=null;
let driverMap=null, drvMarkers={restaurant:null, driver:null, orders:{}, line:null};

function toast(msg,type){
  type=type||"info";
  const map={success:"success",danger:"danger",warning:"warning",info:"primary"};
  const el=document.createElement("div");
  el.className="toast align-items-center text-bg-"+(map[type]||"primary")+" border-0 mb-2";
  el.setAttribute("role","alert");
  el.innerHTML=`<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  document.getElementById("toastHost").appendChild(el);
  const t=new bootstrap.Toast(el,{delay:3200}); t.show();
  el.addEventListener("hidden.bs.toast",()=>el.remove());
}
function statusColor(status){
  switch(status){
    case "AVAILABLE": case "DELIVERED": return "#1E8E5A";
    case "BUSY": return "#D64545";
    case "ASSIGNED": return "#2563EB";
    case "OUT_FOR_DELIVERY": return "#EA7317";
    default: return "#6b5f57";
  }
}
function dotIcon(color,big){
  return L.divIcon({className:"",html:`<div style="width:${big?18:13}px;height:${big?18:13}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 2px ${color}55;"></div>`,iconSize:[big?18:13,big?18:13]});
}
function initMap(){
  driverMap=L.map('driverMap',{scrollWheelZoom:false,zoomControl:false}).setView([RESTAURANT.lat,RESTAURANT.lng],12);
  L.control.zoom({position:'bottomright'}).addTo(driverMap);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(driverMap);
  drvMarkers.restaurant=L.marker([RESTAURANT.lat,RESTAURANT.lng],{icon:dotIcon("#651C22",true)}).addTo(driverMap).bindPopup("<b>"+RESTAURANT.name+"</b>");
  setTimeout(()=>driverMap.invalidateSize(),200);
}
function updateDriverMap(driver,orders){
  if(!driverMap) return;
  if(drvMarkers.driver) driverMap.removeLayer(drvMarkers.driver);
  drvMarkers.driver=L.marker([driver.lat,driver.lng],{icon:dotIcon(statusColor(driver.status),true)}).addTo(driverMap).bindPopup(`<b>${driver.name}</b><br>${driver.status}`);
  Object.values(drvMarkers.orders).forEach(m=>driverMap.removeLayer(m));
  drvMarkers.orders={};
  if(drvMarkers.line){ driverMap.removeLayer(drvMarkers.line); drvMarkers.line=null; }
  const pts=[[RESTAURANT.lat,RESTAURANT.lng]];
  orders.forEach(o=>{
    const m=L.marker([o.lat,o.lng],{icon:dotIcon(statusColor(o.status))}).addTo(driverMap).bindPopup(`<b>${o.id}</b><br>${o.customerName}`);
    drvMarkers.orders[o.id]=m; pts.push([o.lat,o.lng]);
  });
  if(pts.length>1){
    drvMarkers.line=L.polyline(pts,{color:"#E7A93C",weight:4,dashArray:"6 6"}).addTo(driverMap);
    driverMap.fitBounds(drvMarkers.line.getBounds(),{padding:[24,24]});
  } else {
    driverMap.setView([driver.lat,driver.lng],12);
  }
}

/* ===================== Rendering ===================== */
function renderAll(){
  const d=STORE.drivers.find(x=>x.id===currentDriverId);
  if(!d) return;
  const myOrders=STORE.orders.filter(o=>o.driverId===d.id && (o.status==="ASSIGNED"||o.status==="OUT_FOR_DELIVERY"));

  document.getElementById("driverInfoCard").innerHTML=`
    <div class="eyebrow">Driver Profile</div>
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h4 class="mb-1">${d.name}</h4>
        <div class="mono small-note mb-2">${d.id}</div>
      </div>
      <span class="badge-status ${d.status}">${d.status}</span>
    </div>
    <hr class="my-2">
    <div class="small-note mb-1"><i class="fa-solid fa-route me-1"></i> Assigned area/road</div>
    <div class="fw-semibold mb-2">${d.groupKey||"None"}</div>
    <div class="small-note mb-1"><i class="fa-solid fa-shop me-1"></i> Pickup point</div>
    <div class="fw-semibold mb-3">${RESTAURANT.name}, ${RESTAURANT.area}<br><span class="mono small-note">${RESTAURANT.lat}, ${RESTAURANT.lng}</span></div>
    <div class="action-row">
      <button class="btn btn-saffron" id="btnStartDel" ${myOrders.some(o=>o.status==='ASSIGNED')?'':'disabled'}><i class="fa-solid fa-play me-1"></i>Start</button>
      <button class="btn btn-brand" id="btnCompleteDel" ${myOrders.some(o=>o.status==='OUT_FOR_DELIVERY')?'':'disabled'}><i class="fa-solid fa-check me-1"></i>Delivered</button>
    </div>`;
  document.getElementById("btnStartDel").onclick=()=>startDelivery(d.id);
  document.getElementById("btnCompleteDel").onclick=()=>completeDelivery(d.id);

  document.getElementById("driverOrdersBox").innerHTML = myOrders.length ? myOrders.map(o=>`
    <div class="order-card">
      <div class="d-flex justify-content-between"><span class="oid">${o.id}</span><span class="badge-status ${o.status}">${o.status.replace(/_/g," ")}</span></div>
      <div class="small-note mt-1">
        <i class="fa-solid fa-user me-1"></i>${o.customerName}<br>
        <i class="fa-solid fa-location-dot me-1"></i>${o.area}, ${o.road}<br>
        <i class="fa-solid fa-bowl-food me-1"></i>${o.items.map(i=>i.name).join(", ")}<br>
        <i class="fa-solid fa-map-pin me-1"></i><span class="mono">${o.lat}, ${o.lng}</span>
      </div>
    </div>`).join("") : `<p class="small-note">No active orders assigned right now.</p>`;

  updateDriverMap(d,myOrders);
}

/* ===================== Actions ===================== */
async function startDelivery(driverId){
  await refreshStore();
  const driver=STORE.drivers.find(d=>d.id===driverId);
  if(!driver||driver.status!=="BUSY"){ toast("Driver has no active assignment.","warning"); return; }
  const orders=STORE.orders.filter(o=>o.driverId===driverId && o.status==="ASSIGNED");
  if(orders.length===0){ toast("Nothing to start — no ASSIGNED orders.","warning"); return; }
  orders.forEach(o=>o.status="OUT_FOR_DELIVERY");
  await saveStore(STORE);
  toast(driver.name+" is now OUT FOR DELIVERY","info");
  renderAll();
}
async function completeDelivery(driverId){
  await refreshStore();
  const driver=STORE.drivers.find(d=>d.id===driverId);
  if(!driver) return;
  const orders=STORE.orders.filter(o=>o.driverId===driverId && o.status==="OUT_FOR_DELIVERY");
  if(orders.length===0){ toast("No orders currently out for delivery.","warning"); return; }
  orders.forEach(o=>o.status="DELIVERED");
  driver.status="AVAILABLE"; driver.groupKey=null; driver.orderIds=[];
  await saveStore(STORE);
  toast(driver.name+" completed delivery and is now AVAILABLE","success");
  renderAll();
}

/* ===================== Auth ===================== */
document.getElementById('showDrvCreds').addEventListener('click', async e=>{
  e.preventDefault();
  await refreshStore();
  const rows=STORE.drivers.slice(0,3).map(d=>`${d.id} / ${driverPassword(d)} — ${d.name}`).join('<br>');
  const box=document.getElementById('credsBox');
  box.classList.remove('d-none');
  box.innerHTML=`Demo driver logins (showing 3 of ${STORE.drivers.length}):<br>${rows}`;
});
document.getElementById('btnDrvLogin').addEventListener('click', async ()=>{
  const id=document.getElementById('loginDrvId').value.trim().toUpperCase();
  const pass=document.getElementById('loginDrvPass').value;
  const err=document.getElementById('drvLoginErr');
  await refreshStore();
  const drv=STORE.drivers.find(d=>d.id===id);
  if(!drv||driverPassword(drv)!==pass){ err.textContent="Invalid driver ID or password."; return; }
  err.textContent="";
  currentDriverId=drv.id;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  initMap();
  renderAll();
  toast("Welcome, "+drv.name+"!","success");
  startPolling();
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  currentDriverId=null;
  stopPolling();
  document.getElementById('mainApp').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('loginDrvId').value='';
  document.getElementById('loginDrvPass').value='';
  document.getElementById('credsBox').classList.add('d-none');
});
document.getElementById('darkToggleBtn').addEventListener('click', ()=>{
  document.body.classList.toggle('dark-theme');
  const isDark=document.body.classList.contains('dark-theme');
  document.getElementById('darkToggleBtn').querySelector('i').className=isDark?'fa-solid fa-sun':'fa-solid fa-moon';
});

/* ===================== Polling for live updates ===================== */
let pollTimer=null;
function startPolling(){
  stopPolling();
  pollTimer=setInterval(async ()=>{ await refreshStore(); renderAll(); }, 4000);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }

/* ===================== Init ===================== */
(async function init(){
  STORE = await loadStore();
})();
</script>
